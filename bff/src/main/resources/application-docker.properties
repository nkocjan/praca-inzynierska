# === Profil Docker ===
# Nadpisuje adresy serwisów na nazwy kontenerów Docker

user-service.url=http://inz-user-service:8081
expense-service.url=http://inz-expense-service:28081
budget-service.url=http://inz-budget-service:28082

# Za bramą Caddy (TLS kończy się na niej): adres żądania z X-Forwarded-Proto/Host. Bez tego żądanie
# z https://inzynierka.nkocjan.pl wygląda na cross-origin i CORS (tylko localhost:5173) zwraca 403.
server.forward-headers-strategy=native

# Dokumentacja API (OpenAPI i Swagger UI) tylko do pracy lokalnej, np. npm run generate:api.
# Serwer jej nie publikuje.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
