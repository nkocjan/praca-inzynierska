# Całe demo (bazy, mikroserwisy, frontend). Na serwerze za bramą Caddy z repo my_own_page:
# sieć `web-gateway`, kontenery `inz-frontend` (SPA) i `inz-bff` (/api). JWT_SECRET w .env
# (na serwerze symlink do my_own_page/env/praca-inzynierska.env; to repo jest publiczne).
# Lokalnie same bazy: `docker compose up -d userdb budgetdb expense-A1 expense-A2 expense-B1 expense-B2`;
# całość wymaga `docker network create web-gateway` (raz).
services:
  userdb:
    image: postgres:16
    container_name: userdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userdb
    volumes:
      - userdb_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  budgetdb:
    image: postgres:16
    container_name: budgetdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: budgetdb
    volumes:
      - budgetdb_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d budgetdb"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  expense-A1:
    image: postgres:16
    container_name: expense-A1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expenseA
      PGDATA: /var/lib/postgresql/data/pgdata
    command: postgres -c wal_level=replica -c max_wal_senders=5 -c listen_addresses='*'
    volumes:
      - expenseA1_data:/var/lib/postgresql/data/pgdata
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  expense-A2:
    image: postgres:16
    container_name: expense-A2
    depends_on:
      expense-A1:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - expenseA2_data:/var/lib/postgresql/data/pgdata
      - ./replica-scripts:/docker-entrypoint-initdb.d
    entrypoint: ["/docker-entrypoint-initdb.d/replica-entrypoint.sh"]
    ports:
      - "127.0.0.1:5435:5432"
    restart: unless-stopped

  expense-B1:
    image: postgres:16
    container_name: expense-B1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expenseB
    command: postgres -c wal_level=replica -c max_wal_senders=5 -c listen_addresses='*'
    volumes:
      - expenseB1_data:/var/lib/postgresql/data
      - ./init-scripts-b:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  expense-B2:
    image: postgres:16
    container_name: expense-B2
    depends_on:
      expense-B1:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - expenseB2_data:/var/lib/postgresql/data
      - ./replica-scripts-b:/docker-entrypoint-initdb.d
    entrypoint: ["/docker-entrypoint-initdb.d/replica-entrypoint-b.sh"]
    ports:
      - "127.0.0.1:5437:5432"
    restart: unless-stopped

  # ============================================================
  #  Mikroserwisy (Spring Boot, profil `docker`: adresy baz i serwisów po nazwach kontenerów)
  # ============================================================

  inz-user-service:
    build:
      context: ./user-service
    container_name: inz-user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      userdb:
        condition: service_healthy
    restart: unless-stopped

  inz-budget-service:
    build:
      context: ./budget-service
    container_name: inz-budget-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      budgetdb:
        condition: service_healthy
    restart: unless-stopped

  inz-expense-service:
    build:
      context: ./expense-service
    container_name: inz-expense-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      expense-A1:
        condition: service_healthy
      expense-B1:
        condition: service_healthy
    restart: unless-stopped

  inz-bff:
    build:
      context: ./bff
    container_name: inz-bff
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      - inz-user-service
      - inz-expense-service
      - inz-budget-service
    networks:
      - default
      - web-gateway
    restart: unless-stopped

  # Zbudowany frontend (Vite, VITE_API_URL=/api z frontend/.env.production).
  inz-frontend:
    build:
      context: ./frontend
    container_name: inz-frontend
    networks:
      - web-gateway
    restart: unless-stopped

volumes:
  userdb_data:
  budgetdb_data:
  expenseA1_data:
  expenseA2_data:
  expenseB1_data:
  expenseB2_data:

networks:
  web-gateway:
    external: true
