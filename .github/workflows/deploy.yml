name: Deploy to VPS

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: deploy-praca-inzynierska
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Praca Inzynierska to VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Budowa czterech serwisów Mavena trwa kilka minut.
          command_timeout: 30m
          script: |
            set -eu
            cd /home/nkocjan/apps/praca-inzynierska
            git pull --ff-only origin dev
            # Po jednym obrazie naraz: równoległe buildy Mavena zjadłyby pamięć działających aplikacji.
            docker compose --parallel 1 build
            docker compose up -d --remove-orphans
            docker image prune -f || true
