spring.application.name=expense-service
server.port=28081

spring.datasource.shard-a.url=jdbc:postgresql://localhost:5434/expenseA
spring.datasource.shard-a.username=postgres
spring.datasource.shard-a.password=postgres
spring.datasource.shard-a.driver-class-name=org.postgresql.Driver

spring.datasource.shard-b.url=jdbc:postgresql://localhost:5436/expenseB
spring.datasource.shard-b.username=postgres
spring.datasource.shard-b.password=postgres
spring.datasource.shard-b.driver-class-name=org.postgresql.Driver

spring.datasource.shard-a2.url=jdbc:postgresql://localhost:5435/expenseA
spring.datasource.shard-a2.username=postgres
spring.datasource.shard-a2.password=postgres
spring.datasource.shard-a2.driver-class-name=org.postgresql.Driver

spring.datasource.shard-b2.url=jdbc:postgresql://localhost:5437/expenseB
spring.datasource.shard-b2.username=postgres
spring.datasource.shard-b2.password=postgres
spring.datasource.shard-b2.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
